<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

<title>Create Account | FarmStore</title> <link rel="stylesheet" href="css/style.css" > </head> <body> <nav class="navbar">
<a
    href="index.html"
    class="brand"
>
    🌾 FarmStore
</a>

<div class="nav-links">

    <a href="index.html">
        Home
    </a>

    <a href="products.html">
        Products
    </a>

    <a href="cart.html">
        🛒 Cart
        <span
            id="cart-count"
            class="cart-badge"
        >0</span>
    </a>

</div>

</nav> <main class="auth-page">
<div class="auth-card">

    <div class="auth-logo">
        🌱
    </div>

    <span class="auth-label">
        JOIN FARMSTORE
    </span>

    <h1>
        Create your account
    </h1>

    <p class="auth-subtitle">
        Create an account to order products
        and manage your farm purchases.
    </p>


    <div
        id="error"
        class="error-msg"
    ></div>


    <form id="register-form">


        <label for="name">
            Full Name
        </label>

        <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            autocomplete="name"
            required
        >


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
        >

        <small class="auth-help">
            Password must contain at least 6 characters.
        </small>


        <label for="address">
            Delivery Address
        </label>

        <textarea
            id="address"
            placeholder="Enter your delivery address"
            rows="3"
            autocomplete="street-address"
            required
        ></textarea>


        <button
            type="submit"
            class="auth-submit"
            id="register-btn"
        >
            Create Account →
        </button>

    </form>


    <div class="auth-divider">
        <span>Already have an account?</span>
    </div>


    <a
        href="login.html"
        class="auth-register"
    >
        Sign In
    </a>


    <a
        href="index.html"
        class="auth-back"
    >
        ← Back to FarmStore
    </a>

</div>

</main> <script src="js/api.js"></script> <script src="js/cart.js"></script> <script src="js/auth.js"></script> <script> document .getElementById("register-form") .addEventListener( "submit", async function(event) { event.preventDefault(); const error = document.getElementById( "error" ); const button = document.getElementById( "register-btn" ); error.textContent = ""; error.style.display = "none"; const name = document .getElementById("name") .value .trim(); const email = document .getElementById("email") .value .trim(); const password = document .getElementById("password") .value; const address = document .getElementById("address") .value .trim(); if (name.length < 2) { error.textContent = "Please enter your full name."; error.style.display = "block"; return; } if (password.length < 6) { error.textContent = "Password must contain at least 6 characters."; error.style.display = "block"; return; } button.disabled = true; button.textContent = "Creating Account..."; try { await apiCall( "/api/register", "POST", { name, email, password, address } ); window.location.href = "login.html"; } catch (err) { error.textContent = err.message; error.style.display = "block"; button.disabled = false; button.textContent = "Create Account →"; } } ); </script> </body> </html>
