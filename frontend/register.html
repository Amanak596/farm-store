<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register - FarmStore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">🌾 FarmStore</span>
    <div id="nav-right"></div>
</nav>

<div class="form-box">
    <h2>Create Account</h2>
    <p id="form-error" class="error-msg"></p>
    <form id="register-form">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <textarea name="address" placeholder="Delivery Address" rows="3" required></textarea>
        <input type="text" name="phone" placeholder="Phone Number">
        <button class="btn" type="submit">Register</button>
    </form>
    <p style="margin-top:14px;">Already have an account? <a href="login.html">Login here</a></p>
</div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
