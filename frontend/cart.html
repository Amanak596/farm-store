<title>My Cart - FarmStore</title> <link rel="stylesheet" href="css/style.css" > </head> <body> <nav class="navbar">
<a

>
    🌾 FarmStore

<div class="nav-links">

    <a href="index.html">

    <a href="cart.html">

        <span

    <span id="nav-right"></span>

</div>

</nav> <main class="container">
<h1>My Cart</h1>

<div id="cart-box">
    <p class="muted">Loading cart...</p>
</div>

<p
    id="checkout-msg"
    style="margin-top:14px;"
></p>

</main> <script src="js/api.js"></script> <script src="js/cart.js"></script> <script src="js/auth.js"></script> <script> function renderCart() { const cart = getCart(); const box = document.getElementById( "cart-box" ); if (cart.length === 0) { box.innerHTML = ` <div class="empty-cart"> <div class="empty-cart-icon"> 🛒 </div> <h2> Your cart is empty </h2> <p class="muted"> Add some farm products to your cart. </p> <a href="products.html" class="btn" > Browse Products → </a> </div> `; return; } box.innerHTML = ` <table> <tr> <th>Product</th> <th>Price</th> <th>Quantity</th> <th>Subtotal</th> <th></th> </tr> ${cart.map(item => ` <tr> <td style=" display:flex; align-items:center; gap:10px; " > <img src="${item.image_url || 'images/placeholder.jpg'}" alt="${item.name}" style=" width:50px; height:50px; object-fit:cover; border-radius:4px; " > ${item.name} </td> <td> ₹${Number(item.price).toFixed(2)} </td> <td> <div class="qty-controls" style=" display:flex; align-items:center; gap:6px; " > <button onclick=" changeQty( ${item.product_id}, ${item.quantity - 1} ) " > - </button> <span> ${item.quantity} </span> <button onclick=" changeQty( ${item.product_id}, ${item.quantity + 1} ) " > + </button> </div> </td> <td> ₹${( Number(item.price) * Number(item.quantity) ).toFixed(2)} </td> <td> <a href="#" onclick=" removeItem( ${item.product_id} ); return false; " style="color:#c0392b;" > Remove </a> </td> </tr> `).join("")} </table> <div class="cart-summary"> <h2> Total: ₹${getCartTotal().toFixed(2)} </h2> <div id="checkout-address" class="checkout-address" > <strong> Delivery Address </strong> <p id="address-text" class="muted" > Checking your account... </p> </div> <button class="btn secondary" id="checkout-btn" style="margin-top:14px;" > Checkout </button> </div> `; document .getElementById("checkout-btn") .addEventListener( "click", checkout ); loadCheckoutAddress(); } function changeQty( productId, newQty ) { if (newQty < 1) { return; } updateCartItemQuantity( productId, newQty ); renderCart(); } function removeItem( productId ) { removeFromCart( productId ); renderCart(); } async function loadCheckoutAddress() { const addressText = document.getElementById( "address-text" ); if (!addressText) { return; } try { const me = await apiCall( "/api/me" ); if (!me.logged_in) { addressText.innerHTML = ` Please <a href="login.html"> sign in </a> before checkout. `; return; } addressText.textContent = me.address || "No delivery address saved."; } catch (err) { addressText.textContent = "Unable to load delivery address."; } } async function checkout() { const msg = document.getElementById( "checkout-msg" ); msg.className = ""; msg.textContent = ""; try { const me = await apiCall( "/api/me" ); if (!me.logged_in) { window.location.href = "login.html"; return; } const cart = getCart(); if (cart.length === 0) { msg.className = "error-msg"; msg.textContent = "Your cart is empty."; return; } if (!me.address) { msg.className = "error-msg"; msg.textContent = "Please add a delivery address to your account."; return; } const items = cart.map( item => ({ product_id: item.product_id, quantity: item.quantity }) ); const result = await apiCall( "/api/orders", "POST", { items, address: me.address } ); clearCart(); msg.className = "success-msg"; msg.textContent = `Order placed successfully! Order #${result.order_id} - Total ₹${Number(result.total).toFixed(2)}`; renderCart(); } catch (err) { msg.className = "error-msg"; msg.textContent = err.message; } } renderCart(); </script> </body> </html>
