<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Cart - FarmStore</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">🌾 FarmStore</span>
    <div id="nav-right"></div>
</nav>

<div class="container">
    <h1>My Cart</h1>
    <div id="cart-box"></div>
    <p id="checkout-msg" style="margin-top:14px;"></p>
</div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script>
function renderCart() {
    const cart = getCart();
    const box = document.getElementById("cart-box");

    if (cart.length === 0) {
        box.innerHTML = `<p class="muted">Your cart is empty. <a href="index.html">Browse products</a></p>`;
        return;
    }

    box.innerHTML = `
        <table>
            <tr><th>Product</th><th>Price</th><th>Quantity</th><th>Subtotal</th><th></th></tr>
            ${cart.map(item => `
                <tr>
                    <td style="display:flex; align-items:center; gap:10px;">
                        <img src="${item.image_url}" style="width:50px; height:50px; object-fit:cover; border-radius:4px;">
                        ${item.name}
                    </td>
                    <td>₹${item.price.toFixed(2)}</td>
                    <td>
                        <div class="qty-controls" style="display:flex; align-items:center; gap:6px;">
                            <button onclick="changeQty(${item.product_id}, ${item.quantity - 1})">-</button>
                            <span>${item.quantity}</span>
                            <button onclick="changeQty(${item.product_id}, ${item.quantity + 1})">+</button>
                        </div>
                    </td>
                    <td>₹${(item.price * item.quantity).toFixed(2)}</td>
                    <td><a href="#" onclick="removeItem(${item.product_id}); return false;" style="color:#c0392b;">Remove</a></td>
                </tr>
            `).join("")}
        </table>
        <h2 style="margin-top:20px;">Total: ₹${getCartTotal().toFixed(2)}</h2>
        <button class="btn secondary" id="checkout-btn" style="margin-top:14px;">Checkout</button>
    `;

    document.getElementById("checkout-btn").addEventListener("click", checkout);
}

function changeQty(productId, newQty) {
    if (newQty < 1) return;
    updateCartItemQuantity(productId, newQty);
    renderCart();
}

function removeItem(productId) {
    removeFromCart(productId);
    renderCart();
}

async function checkout() {
    const msg = document.getElementById("checkout-msg");
    msg.className = "";
    msg.textContent = "";

    try {
        const me = await apiCall("/api/me");
        if (!me.logged_in) {
            window.location.href = "login.html";
            return;
        }

        const cart = getCart();
        const items = cart.map(i => ({ product_id: i.product_id, quantity: i.quantity }));

        const result = await apiCall("/api/orders", "POST", { items, address: me.address });
        clearCart();
        msg.className = "success-msg";
        msg.textContent = `Order placed successfully! Order #${result.order_id} - Total ₹${result.total.toFixed(2)}`;
        renderCart();
    } catch (err) {
        msg.className = "error-msg";
        msg.textContent = err.message;
    }
}

renderCart();
</script>
</body>
</html>
