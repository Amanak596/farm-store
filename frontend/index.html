<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FarmStore - Fertilizers, Tractors, Drones & Tools</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <span class="brand">🌾 FarmStore</span>
    <div id="nav-right"></div>
</nav>

<div class="container">
    <h1>Shop by Category</h1>
    <div class="categories" id="category-list"></div>

    <h2>All Products</h2>
    <div class="product-grid" id="product-grid">
        <p class="muted">Loading products...</p>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth.js"></script>
<script>
async function loadCategories() {
    const categories = await apiCall("/api/categories");
    const list = document.getElementById("category-list");
    list.innerHTML = `<a href="index.html" class="active">All</a>` +
        categories.map(c => `<a href="products.html?category_id=${c.id}">${c.name}</a>`).join("");
}

async function loadProducts() {
    const products = await apiCall("/api/products");
    const grid = document.getElementById("product-grid");

    if (products.length === 0) {
        grid.innerHTML = `<p class="muted">No products found.</p>`;
        return;
    }

    grid.innerHTML = products.map(p => `
        <div class="product-card">
            <a href="product.html?id=${p.id}">
                <img src="${p.image_url}" alt="${p.name}">
            </a>
            <div class="info">
                <h3>${p.name}</h3>
                <div class="qty">In stock: ${p.quantity}</div>
                <div class="price">₹${parseFloat(p.price).toFixed(2)}</div>
                <a class="btn" href="product.html?id=${p.id}">View Details</a>
            </div>
        </div>
    `).join("");
}

loadCategories();
loadProducts();
</script>
</body>
</html>
